apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'com.google.android.gms:play-services-auth:19.2.0' // Assets/GoogleSignIn/Editor/GoogleSignInDependencies.xml:14
    implementation 'com.google.android.gms:play-services-base:18.10.0' // Assets/Firebase/Editor/AppDependencies.xml:20
    implementation 'com.google.firebase:firebase-analytics:23.0.0' // Assets/Firebase/Editor/StorageDependencies.xml:18
    implementation 'com.google.firebase:firebase-analytics-unity:13.9.0' // Assets/Firebase/Editor/AnalyticsDependencies.xml:21
    implementation 'com.google.firebase:firebase-app-unity:13.9.0' // Assets/Firebase/Editor/AppDependencies.xml:25
    implementation 'com.google.firebase:firebase-auth:24.0.1' // Assets/Firebase/Editor/AuthDependencies.xml:16
    implementation 'com.google.firebase:firebase-auth-unity:13.9.0' // Assets/Firebase/Editor/AuthDependencies.xml:23
    implementation 'com.google.firebase:firebase-common:22.0.1' // Assets/Firebase/Editor/AppDependencies.xml:16
    implementation 'com.google.firebase:firebase-crashlytics-ndk:20.0.4' // Assets/Firebase/Editor/CrashlyticsDependencies.xml:16
    implementation 'com.google.firebase:firebase-crashlytics-unity:13.9.0' // Assets/Firebase/Editor/CrashlyticsDependencies.xml:23
    implementation 'com.google.firebase:firebase-firestore:26.1.1' // Assets/Firebase/Editor/FirestoreDependencies.xml:16
    implementation 'com.google.firebase:firebase-firestore-unity:13.9.0' // Assets/Firebase/Editor/FirestoreDependencies.xml:23
    implementation 'com.google.firebase:firebase-iid:21.1.0' // Assets/Firebase/Editor/MessagingDependencies.xml:20
    implementation 'com.google.firebase:firebase-messaging:25.0.1' // Assets/Firebase/Editor/MessagingDependencies.xml:16
    implementation 'com.google.firebase:firebase-messaging-unity:13.9.0' // Assets/Firebase/Editor/MessagingDependencies.xml:27
    implementation 'com.google.firebase:firebase-storage:22.0.1' // Assets/Firebase/Editor/StorageDependencies.xml:16
    implementation 'com.google.firebase:firebase-storage-unity:13.9.0' // Assets/Firebase/Editor/StorageDependencies.xml:23
    implementation 'com.google.flatbuffers:flatbuffers-java:1.12.0' // Assets/Firebase/Editor/MessagingDependencies.xml:22
    implementation 'com.google.signin:google-signin-support:1.0.4' // Assets/GoogleSignIn/Editor/GoogleSignInSupportDependencies.xml:9
// Android Resolver Dependencies End
    // Gemma 3n 온디바이스 추론 (Plugins/Android/GemmaInference.java가 사용).
    // Gemma 3n은 STABLEHLO_COMPOSITE opcode 사용 — 0.10.20+ 필요. 0.10.27이 가장 안정.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
    // tasks-genai에는 com.google.mediapipe.framework.image (MPImage, BitmapImageBuilder)가
    // 포함되어 있지 않음 — 멀티모달 이미지 입력(generateResponseWithImage)에 필요해서 별도 추가.
    // tasks-vision은 0.10.27이 존재하지 않고(0.10.26.1 -> 0.10.28) 비전 태스크까지 포함돼 무거움.
    // tasks-core 0.10.26.1은 guava/protobuf-javalite 버전이 tasks-genai:0.10.27과 동일해 충돌 없음.
    implementation 'com.google.mediapipe:tasks-core:0.10.26.1'
    // Health Connect 의존성은 HealthConnect.androidlib (Kotlin 모듈)이 소유.
    // (Health Connect 1.1.0은 Kotlin suspend API라 Kotlin 플러그인으로 구현 — HealthConnectPlugin.kt)
    // Unity가 :unityLibrary:HealthConnect.androidlib 를 자동으로 implementation project 의존성에 추가함.
**DEPS**}

// Android Resolver Exclusions Start
android {
  packaging {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/armeabi-v7a/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        // MediaPipe tasks-genai 0.10.27이 Java 21로 컴파일됨 + Gemma 3n의 STABLEHLO_COMPOSITE
        // opcode가 0.10.14에 없어서 fallback 불가. 21로 가야 함.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
